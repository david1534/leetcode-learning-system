name: Daily practice reminder
on:
  schedule:
    - cron: "0 12,13 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  remind:
    name: Deliver 8 AM Eastern reminder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - id: time
        name: Check Eastern time
        shell: bash
        run: |
          echo "hour=$(TZ=America/New_York date +%H)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Build reminder body
        if: steps.time.outputs.hour == '08' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: python -m study reminder > "$RUNNER_TEMP/reminder.md"
      - name: Close older reminder issues
        if: steps.time.outputs.hour == '08' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'practice-reminder', per_page: 100 });
            for (const issue of issues) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
      - name: Create today's reminder issue
        if: steps.time.outputs.hour == '08' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          REMINDER_DATE: ${{ steps.time.outputs.date }}
          BODY_PATH: ${{ runner.temp }}/reminder.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try { await github.rest.issues.getLabel({ owner, repo, name: 'practice-reminder' }); }
            catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: 'practice-reminder', color: '1D76DB', description: 'Daily adaptive study reminder' });
            }
            await github.rest.issues.create({ owner, repo, title: `Practice due - ${process.env.REMINDER_DATE}`, body: fs.readFileSync(process.env.BODY_PATH, 'utf8'), labels: ['practice-reminder'], assignees: [owner] });
      - name: Explain reminder result
        if: always()
        shell: bash
        run: |
          {
            echo "## Daily practice reminder"
            echo "This workflow runs at both UTC offsets that can correspond to 8 AM Eastern."
            echo ""
            echo "- Eastern hour: ${{ steps.time.outputs.hour }}"
            echo "- Trigger: ${{ github.event_name }}"
            if [[ "${{ steps.time.outputs.hour }}" == "08" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "- Result: reminder delivery was attempted; inspect failed steps above if this run is red."
            else
              echo "- Result: intentionally skipped because this was the non-8-AM duplicate cron run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
