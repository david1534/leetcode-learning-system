name: Code quality
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        id: tests
        run: python -m pytest
      - name: Lint all tracked Python
        id: lint
        run: python -m ruff check --no-cache .
      - name: Explain quality result
        if: always()
        shell: bash
        run: |
          {
            echo "## Code quality"
            echo "This workflow protects main by running behavioral tests and linting every tracked Python file."
            echo ""
            echo "- Tests: ${{ steps.tests.outcome }}"
            echo "- Ruff: ${{ steps.lint.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
