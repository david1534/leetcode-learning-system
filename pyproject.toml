[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-learning-system"
version = "0.1.0"
description = "A local, testable algorithm curriculum with adaptive spaced repetition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fsrs==6.3.2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
study = "study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
